<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DocQnA — AI Document Q&A</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0d0d;
    --surface: #161616;
    --surface2: #1e1e1e;
    --border: #2a2a2a;
    --border2: #333;
    --accent: #6C63FF;
    --accent-dim: #4e47c4;
    --text: #f0f0f0;
    --text2: #999;
    --text3: #555;
    --success: #22c55e;
    --success-bg: #0d2b1a;
    --warning: #f59e0b;
    --warning-bg: #2a1f0a;
    --danger: #ef4444;
    --danger-bg: #2a0f0f;
  }

  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; line-height: 1.6; min-height: 100vh; display: flex; flex-direction: column; }

  /* ── Login overlay ── */
  #loginOverlay { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 100; }
  .login-card { background: var(--surface); border: 0.5px solid var(--border2); border-radius: 14px; padding: 2rem; width: 320px; display: flex; flex-direction: column; gap: 1.25rem; }
  .login-card h2 { font-size: 18px; font-weight: 500; color: var(--text); }
  .login-card h2 span { color: var(--accent); }
  .form-field { display: flex; flex-direction: column; gap: 6px; }
  .form-field label { font-size: 12px; color: var(--text2); }
  .form-field input { background: var(--surface2); border: 0.5px solid var(--border2); border-radius: 8px; padding: 8px 12px; color: var(--text); font-size: 14px; outline: none; transition: border-color 0.15s; }
  .form-field input:focus { border-color: var(--accent); }
  .login-btn { background: var(--accent); border: none; border-radius: 8px; color: white; font-size: 14px; font-weight: 500; padding: 9px; cursor: pointer; transition: background 0.12s; }
  .login-btn:hover { background: var(--accent-dim); }
  .login-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .login-error { font-size: 12px; color: var(--danger); background: var(--danger-bg); border-radius: 6px; padding: 6px 10px; display: none; }

  header { background: var(--surface); border-bottom: 0.5px solid var(--border); padding: 0 2rem; height: 56px; display: flex; align-items: center; justify-content: space-between; }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo-icon { width: 32px; height: 32px; background: var(--accent); border-radius: 8px; display: flex; align-items: center; justify-content: center; }
  .logo-icon svg { width: 16px; height: 16px; fill: white; }
  .logo-name { font-size: 16px; font-weight: 500; color: var(--text); }
  .logo-name span { color: var(--accent); }
  .header-right { display: flex; align-items: center; gap: 12px; }
  .user-badge { background: var(--surface2); border: 0.5px solid var(--border); border-radius: 20px; padding: 4px 12px; font-size: 12px; color: var(--text2); }
  .logout-btn { background: transparent; border: 0.5px solid var(--border2); border-radius: 6px; color: var(--text2); padding: 4px 10px; font-size: 12px; cursor: pointer; transition: background 0.12s, color 0.12s; }
  .logout-btn:hover { background: var(--surface2); color: var(--danger); border-color: var(--danger); }

  .layout { display: grid; grid-template-columns: 280px 1fr; flex: 1; min-height: 0; overflow: hidden; }

  .sidebar { background: var(--surface); border-right: 0.5px solid var(--border); display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .sidebar-header { padding: 1.25rem 1rem 0.75rem; border-bottom: 0.5px solid var(--border); }
  .sidebar-title { font-size: 11px; font-weight: 500; color: var(--text3); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.75rem; }

  .upload-zone { border: 1.5px dashed var(--border2); border-radius: 10px; padding: 1.25rem; text-align: center; cursor: pointer; transition: border-color 0.15s, background 0.15s; margin-bottom: 0.75rem; }
  .upload-zone:hover { border-color: var(--accent); background: #1a1830; }
  .upload-zone.dragover { border-color: var(--accent); background: #1a1830; }
  .upload-zone.uploading { pointer-events: none; opacity: 0.6; }
  .upload-icon { width: 32px; height: 32px; margin: 0 auto 8px; background: var(--surface2); border-radius: 8px; display: flex; align-items: center; justify-content: center; }
  .upload-icon svg { width: 16px; height: 16px; fill: var(--accent); }
  .upload-zone p { font-size: 12px; color: var(--text2); }
  .upload-zone span { color: var(--accent); }
  .upload-types { font-size: 11px; color: var(--text3); margin-top: 4px; }

  .doc-list { flex: 1; overflow-y: auto; padding: 0.5rem; min-height: 0; }
  .doc-list-label { font-size: 11px; font-weight: 500; color: var(--text3); text-transform: uppercase; letter-spacing: 0.08em; padding: 0.5rem 0.5rem 0.25rem; }
  .doc-list-empty { font-size: 12px; color: var(--text3); padding: 0.75rem 0.5rem; }
  .doc-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; cursor: pointer; transition: background 0.12s; margin-bottom: 2px; }
  .doc-item:hover { background: var(--surface2); }
  .doc-item.active { background: #1a1830; border: 0.5px solid #3d3680; }
  .doc-icon { width: 28px; height: 28px; border-radius: 6px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .doc-icon.pdf { background: #2a1010; }
  .doc-icon.txt { background: #0d2020; }
  .doc-icon.docx { background: #0d1a2a; }
  .doc-icon svg { width: 14px; height: 14px; }
  .doc-info { flex: 1; min-width: 0; }
  .doc-name { font-size: 13px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .doc-meta { font-size: 11px; color: var(--text3); }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .status-dot.ready { background: var(--success); }
  .status-dot.processing { background: var(--warning); animation: pulse 1.2s infinite; }
  .status-dot.pending { background: var(--warning); animation: pulse 1.2s infinite; }
  .status-dot.failed { background: var(--danger); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

  .main { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .main-empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text3); gap: 12px; }
  .main-empty-icon { width: 56px; height: 56px; background: var(--surface); border: 0.5px solid var(--border); border-radius: 14px; display: flex; align-items: center; justify-content: center; }
  .main-empty-icon svg { width: 24px; height: 24px; fill: var(--text3); }
  .main-empty p { font-size: 14px; }

  .doc-view { display: flex; flex-direction: column; height: 100%; min-height: 0; overflow: hidden; }
  .doc-topbar { padding: 1rem 1.5rem; border-bottom: 0.5px solid var(--border); display: flex; align-items: center; justify-content: space-between; background: var(--surface); }
  .doc-topbar-left { display: flex; align-items: center; gap: 10px; }
  .doc-title { font-size: 15px; font-weight: 500; color: var(--text); }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 20px; font-weight: 500; }
  .badge.ready { background: var(--success-bg); color: var(--success); }
  .badge.processing { background: var(--warning-bg); color: var(--warning); }
  .badge.pending { background: var(--warning-bg); color: var(--warning); }
  .badge.failed { background: var(--danger-bg); color: var(--danger); }
  .doc-topbar-right { display: flex; gap: 8px; }
  .btn-sm { background: transparent; border: 0.5px solid var(--border2); border-radius: 6px; color: var(--text2); padding: 5px 12px; font-size: 12px; cursor: pointer; transition: background 0.12s, color 0.12s; }
  .btn-sm:hover { background: var(--surface2); color: var(--text); }
  .btn-sm.danger:hover { border-color: var(--danger); color: var(--danger); }

  .chat-area { flex: 1; overflow-y: auto; padding: 1.5rem; display: flex; flex-direction: column; gap: 1.25rem; min-height: 0; }
  .msg { display: flex; gap: 10px; max-width: 85%; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg-avatar { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 500; flex-shrink: 0; }
  .msg-avatar.ai { background: var(--accent); color: white; }
  .msg-avatar.user { background: var(--surface2); color: var(--text2); border: 0.5px solid var(--border2); }
  .msg-bubble { background: var(--surface); border: 0.5px solid var(--border); border-radius: 12px; padding: 10px 14px; font-size: 13px; color: var(--text); line-height: 1.6; }
  .msg.user .msg-bubble { background: #1a1830; border-color: #3d3680; }
  .msg-time { font-size: 11px; color: var(--text3); margin-top: 4px; text-align: right; }
  .msg.user .msg-time { text-align: left; }

  .sources { margin-top: 8px; }
  .sources-label { font-size: 11px; color: var(--text3); margin-bottom: 4px; }
  .source-chip { display: inline-block; background: var(--surface2); border: 0.5px solid var(--border2); border-radius: 6px; padding: 3px 8px; font-size: 11px; color: var(--text2); margin: 2px 2px 0 0; }

  .chat-input-area { padding: 1rem 1.5rem; border-top: 0.5px solid var(--border); background: var(--surface); }
  .chat-input-wrap { display: flex; gap: 10px; align-items: flex-end; background: var(--surface2); border: 0.5px solid var(--border2); border-radius: 12px; padding: 8px 12px; transition: border-color 0.15s; }
  .chat-input-wrap:focus-within { border-color: var(--accent); }
  .chat-input-wrap textarea { flex: 1; background: transparent; border: none; outline: none; color: var(--text); font-size: 14px; resize: none; line-height: 1.5; min-height: 20px; max-height: 120px; font-family: inherit; }
  .chat-input-wrap textarea::placeholder { color: var(--text3); }
  .chat-input-wrap textarea:disabled { opacity: 0.5; }
  .send-btn { width: 32px; height: 32px; background: var(--accent); border: none; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: background 0.12s; }
  .send-btn:hover { background: var(--accent-dim); }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .send-btn svg { width: 14px; height: 14px; fill: white; }
  .input-hint { font-size: 11px; color: var(--text3); margin-top: 6px; }

  .thinking { display: flex; gap: 4px; align-items: center; padding: 10px 14px; }
  .thinking span { width: 6px; height: 6px; background: var(--text3); border-radius: 50%; animation: bounce 1.2s infinite; }
  .thinking span:nth-child(2) { animation-delay: 0.2s; }
  .thinking span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { 0%,80%,100% { transform: translateY(0); } 40% { transform: translateY(-6px); } }

  input[type="file"] { display: none; }

  .toast-wrap { position: fixed; bottom: 1.5rem; right: 1.5rem; display: flex; flex-direction: column; gap: 8px; z-index: 200; pointer-events: none; }
  .toast { background: var(--surface); border: 0.5px solid var(--border2); border-radius: 10px; padding: 10px 16px; font-size: 13px; color: var(--text); max-width: 300px; opacity: 0; transform: translateY(10px); transition: opacity 0.2s, transform 0.2s; pointer-events: none; }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.success { border-color: var(--success); }
  .toast.error { border-color: var(--danger); color: var(--danger); }
</style>
</head>
<body>

<!-- Login overlay -->
<div id="loginOverlay">
  <div class="login-card">
    <h2>Doc<span>QnA</span> — Sign in</h2>
    <div class="form-field">
      <label for="loginUser">Username</label>
      <input type="text" id="loginUser" placeholder="testuser" autocomplete="username" />
    </div>
    <div class="form-field">
      <label for="loginPass">Password</label>
      <input type="password" id="loginPass" placeholder="password123" autocomplete="current-password" />
    </div>
    <div class="login-error" id="loginError"></div>
    <button class="login-btn" id="loginBtn" onclick="doLogin()">Sign in</button>
  </div>
</div>

<header>
  <div class="logo">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm-1 1.5L18.5 9H13V3.5zM6 20V4h5v7h7v9H6z"/></svg>
    </div>
    <span class="logo-name">Doc<span>QnA</span></span>
  </div>
  <div class="header-right">
    <span class="user-badge" id="userBadge">—</span>
    <button class="logout-btn" onclick="doLogout()">Sign out</button>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title">Documents</div>
      <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">
        <div class="upload-icon">
          <svg viewBox="0 0 24 24"><path d="M19.35 10.04A7.49 7.49 0 0 0 12 4C9.11 4 6.6 5.64 5.35 8.04A5.994 5.994 0 0 0 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
        </div>
        <p><span>Click to upload</span> or drag & drop</p>
        <p class="upload-types">PDF · DOCX · TXT</p>
      </div>
      <input type="file" id="fileInput" accept=".pdf,.docx,.txt" onchange="uploadFile(this.files[0])" />
    </div>
    <div class="doc-list" id="docList">
      <div class="doc-list-label">My documents</div>
      <div class="doc-list-empty" id="docListEmpty" style="display:none;">No documents yet. Upload one above.</div>
    </div>
  </aside>

  <main class="main" id="main">
    <div class="main-empty" id="mainEmpty">
      <div class="main-empty-icon">
        <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm-1 1.5L18.5 9H13V3.5zM6 20V4h5v7h7v9H6z"/></svg>
      </div>
      <p>Select a document to start asking questions</p>
    </div>
    <div class="doc-view" id="docView" style="display:none;">
      <div class="doc-topbar">
        <div class="doc-topbar-left">
          <span class="doc-title" id="docTitle"></span>
          <span class="badge" id="docBadge"></span>
        </div>
        <div class="doc-topbar-right">
          <button class="btn-sm danger" onclick="confirmDelete()">Delete</button>
        </div>
      </div>
      <div class="chat-area" id="chatArea"></div>
      <div class="chat-input-area">
        <div class="chat-input-wrap">
          <textarea id="questionInput" placeholder="Ask a question about this document..." rows="1"
            onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
          <button class="send-btn" id="sendBtn" onclick="sendQuestion()">
            <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
          </button>
        </div>
        <div class="input-hint">Press Enter to send · Shift+Enter for new line</div>
      </div>
    </div>
  </main>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script>
// ─────────────────────────────────────────────
//  State
// ─────────────────────────────────────────────
let token = localStorage.getItem('docqna_token') || null;
let currentUsername = localStorage.getItem('docqna_user') || null;
let selectedDocId = null;
let selectedDocStatus = null;
let pollTimer = null;

// ─────────────────────────────────────────────
//  Helpers
// ─────────────────────────────────────────────
function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function timeAgo(isoString) {
  const d = new Date(isoString);
  if (isNaN(d)) return '';
  const diff = (Date.now() - d.getTime()) / 1000;
  if (diff < 60) return 'just now';
  if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
  if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
  return Math.floor(diff / 86400) + 'd ago';
}

function formatBytes(bytes) {
  if (!bytes) return '';
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / 1048576).toFixed(1) + ' MB';
}

function showToast(msg, type = '') {
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast' + (type ? ' ' + type : '');
  el.textContent = msg;
  wrap.appendChild(el);
  requestAnimationFrame(() => { requestAnimationFrame(() => { el.classList.add('show'); }); });
  setTimeout(() => {
    el.classList.remove('show');
    setTimeout(() => el.remove(), 250);
  }, 3000);
}

async function apiFetch(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
  if (token) headers['Authorization'] = 'Bearer ' + token;
  if (opts.body instanceof FormData) delete headers['Content-Type'];
  const res = await fetch(path, { ...opts, headers });
  if (res.status === 401) { doLogout(); throw new Error('Unauthorized'); }
  return res;
}

// ─────────────────────────────────────────────
//  Auth
// ─────────────────────────────────────────────
async function doLogin() {
  const username = document.getElementById('loginUser').value.trim();
  const password = document.getElementById('loginPass').value;
  const errEl = document.getElementById('loginError');
  const btn = document.getElementById('loginBtn');
  errEl.style.display = 'none';
  if (!username || !password) { errEl.textContent = 'Enter username and password.'; errEl.style.display = 'block'; return; }
  btn.disabled = true;
  btn.textContent = 'Signing in…';
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    if (!res.ok) { const j = await res.json().catch(() => ({})); throw new Error(j.message || 'Invalid credentials'); }
    const data = await res.json();
    token = data.token || data.accessToken || data.access_token;
    if (!token) throw new Error('No token in response');
    localStorage.setItem('docqna_token', token);
    localStorage.setItem('docqna_user', username);
    currentUsername = username;
    document.getElementById('userBadge').textContent = username;
    document.getElementById('loginOverlay').style.display = 'none';
    loadDocuments();
  } catch (e) {
    errEl.textContent = e.message;
    errEl.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Sign in';
  }
}

function doLogout() {
  token = null;
  currentUsername = null;
  selectedDocId = null;
  localStorage.removeItem('docqna_token');
  localStorage.removeItem('docqna_user');
  clearInterval(pollTimer);
  document.getElementById('loginOverlay').style.display = 'flex';
  document.getElementById('loginUser').value = '';
  document.getElementById('loginPass').value = '';
  renderDocList([]);
  showMainEmpty();
}

// Allow Enter key on login form
document.addEventListener('keydown', e => {
  if (document.getElementById('loginOverlay').style.display !== 'none' && e.key === 'Enter') doLogin();
});

// ─────────────────────────────────────────────
//  Document list
// ─────────────────────────────────────────────
async function loadDocuments() {
  try {
    const res = await apiFetch('/api/documents');
    if (!res.ok) throw new Error('Failed to load documents');
    const docs = await res.json();
    renderDocList(Array.isArray(docs) ? docs : (docs.items || docs.data || []));
  } catch (e) {
    showToast('Could not load documents: ' + e.message, 'error');
  }
}

function renderDocList(docs) {
  const list = document.getElementById('docList');
  // Remove all doc items (keep label)
  list.querySelectorAll('.doc-item').forEach(el => el.remove());
  const empty = document.getElementById('docListEmpty');

  if (!docs.length) {
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  docs.forEach(doc => {
    const item = buildDocItem(doc);
    list.appendChild(item);
  });

  // Re-select currently open doc if still in list
  if (selectedDocId) {
    const match = docs.find(d => d.id === selectedDocId);
    if (match) {
      const el = list.querySelector(`[data-id="${selectedDocId}"]`);
      if (el) el.classList.add('active');
    } else {
      selectedDocId = null;
      showMainEmpty();
    }
  }
}

function buildDocItem(doc) {
  const ext = (doc.fileName || doc.filename || doc.name || '').split('.').pop().toLowerCase();
  const iconColor = ext === 'pdf' ? '#ef4444' : ext === 'txt' ? '#22c55e' : '#378add';
  const status = (doc.status || '').toLowerCase();
  const sizeFmt = formatBytes(doc.fileSize || doc.size);
  const uploaded = timeAgo(doc.uploadedAt || doc.createdAt || doc.uploadDate);
  const meta = [sizeFmt, uploaded].filter(Boolean).join(' · ');

  const div = document.createElement('div');
  div.className = 'doc-item';
  div.dataset.id = doc.id;
  div.dataset.status = status;
  div.innerHTML = `
    <div class="doc-icon ${ext}">
      <svg viewBox="0 0 24 24" fill="${iconColor}"><path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
    </div>
    <div class="doc-info">
      <div class="doc-name" title="${escapeHtml(doc.fileName || doc.filename || doc.name || 'Document')}">${escapeHtml(doc.fileName || doc.filename || doc.name || 'Document')}</div>
      <div class="doc-meta">${escapeHtml(meta)}</div>
    </div>
    <div class="status-dot ${status}"></div>`;
  div.addEventListener('click', () => selectDoc(doc.id));
  return div;
}

// ─────────────────────────────────────────────
//  Select / open a document
// ─────────────────────────────────────────────
async function selectDoc(docId) {
  clearInterval(pollTimer);
  selectedDocId = docId;

  document.querySelectorAll('.doc-item').forEach(d => d.classList.remove('active'));
  const activeEl = document.querySelector(`.doc-item[data-id="${docId}"]`);
  if (activeEl) activeEl.classList.add('active');

  // Fetch fresh details
  try {
    const res = await apiFetch(`/api/documents/${docId}`);
    if (!res.ok) throw new Error('Could not load document');
    const doc = await res.json();
    openDocView(doc);
  } catch (e) {
    showToast(e.message, 'error');
  }
}

function openDocView(doc) {
  selectedDocStatus = (doc.status || '').toLowerCase();
  const name = doc.fileName || doc.filename || doc.name || 'Document';

  document.getElementById('mainEmpty').style.display = 'none';
  document.getElementById('docView').style.display = 'flex';
  document.getElementById('docTitle').textContent = name;

  const badge = document.getElementById('docBadge');
  badge.className = 'badge ' + selectedDocStatus;
  badge.textContent = selectedDocStatus.charAt(0).toUpperCase() + selectedDocStatus.slice(1);

  const area = document.getElementById('chatArea');

  if (selectedDocStatus === 'processing' || selectedDocStatus === 'pending') {
    area.innerHTML = `
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#555;gap:8px;padding:3rem 0;">
        <div style="width:40px;height:40px;background:#1e1e1e;border:0.5px solid #2a2a2a;border-radius:10px;display:flex;align-items:center;justify-content:center;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="#f59e0b"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg>
        </div>
        <p style="font-size:13px;">Processing document…</p>
        <p style="font-size:12px;">Generating embeddings and storing vectors</p>
      </div>`;
    setInputEnabled(false);
    pollStatus(doc.id);
  } else if (selectedDocStatus === 'failed') {
    area.innerHTML = `
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--danger);gap:8px;padding:3rem 0;">
        <p style="font-size:13px;">Processing failed for this document.</p>
        <p style="font-size:12px;color:#555;">Try deleting and re-uploading it.</p>
      </div>`;
    setInputEnabled(false);
  } else {
    // Ready — load history
    setInputEnabled(true);
    loadHistory(doc.id, name);
  }
}

function showMainEmpty() {
  document.getElementById('mainEmpty').style.display = 'flex';
  document.getElementById('docView').style.display = 'none';
}

function setInputEnabled(enabled) {
  const ta = document.getElementById('questionInput');
  const btn = document.getElementById('sendBtn');
  ta.disabled = !enabled;
  btn.disabled = !enabled;
}

// ─────────────────────────────────────────────
//  Status polling
// ─────────────────────────────────────────────
function pollStatus(docId) {
  clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    try {
      const res = await apiFetch(`/api/documents/${docId}`);
      if (!res.ok) return;
      const doc = await res.json();
      const status = (doc.status || '').toLowerCase();
      // Update sidebar dot
      const sideItem = document.querySelector(`.doc-item[data-id="${docId}"]`);
      if (sideItem) {
        sideItem.dataset.status = status;
        const dot = sideItem.querySelector('.status-dot');
        if (dot) dot.className = 'status-dot ' + status;
      }
      if (status === 'ready' || status === 'failed') {
        clearInterval(pollTimer);
        if (selectedDocId === docId) openDocView(doc);
      }
    } catch (_) {}
  }, 3000);
}

// ─────────────────────────────────────────────
//  Q&A history
// ─────────────────────────────────────────────
async function loadHistory(docId, docName) {
  const area = document.getElementById('chatArea');
  area.innerHTML = '';

  // Welcome message
  appendMsg(area, 'ai', `Document ready. Ask me anything about <strong>${escapeHtml(docName)}</strong>!`, 'just now');

  try {
    const res = await apiFetch(`/api/qna/history/${docId}`);
    if (!res.ok) return; // no history yet — that's fine
    const history = await res.json();
    const items = Array.isArray(history) ? history : (history.items || history.data || []);
    items.forEach(item => {
      const asked = timeAgo(item.askedAt || item.createdAt || '');
      appendMsg(area, 'user', escapeHtml(item.question), asked);
      const sourcesHtml = buildSourcesHtml(item.sources || item.sourceChunks || []);
      appendMsg(area, 'ai', escapeHtml(item.answer) + sourcesHtml, asked);
    });
    area.scrollTop = area.scrollHeight;
  } catch (_) {}
}

function buildSourcesHtml(sources) {
  if (!sources || !sources.length) return '';
  const chips = sources.map(s => {
    const label = s.pageNumber ? `Page ${s.pageNumber}` : (s.chunkIndex != null ? `Chunk ${s.chunkIndex}` : (typeof s === 'string' ? s : 'Source'));
    return `<span class="source-chip">${escapeHtml(label)}</span>`;
  }).join('');
  return `<div class="sources"><div class="sources-label">Sources used</div>${chips}</div>`;
}

function appendMsg(area, role, html, timeStr) {
  const isUser = role === 'user';
  const div = document.createElement('div');
  div.className = 'msg' + (isUser ? ' user' : '');
  div.innerHTML = `
    <div class="msg-avatar ${role}">${isUser ? 'U' : 'AI'}</div>
    <div>
      <div class="msg-bubble">${html}</div>
      <div class="msg-time">${escapeHtml(timeStr || '')}</div>
    </div>`;
  area.appendChild(div);
}

// ─────────────────────────────────────────────
//  Ask a question
// ─────────────────────────────────────────────
async function sendQuestion() {
  const input = document.getElementById('questionInput');
  const q = input.value.trim();
  if (!q || !selectedDocId || selectedDocStatus !== 'ready') return;

  const area = document.getElementById('chatArea');
  const now = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

  appendMsg(area, 'user', escapeHtml(q), now);

  // Thinking indicator
  const thinking = document.createElement('div');
  thinking.className = 'msg';
  thinking.id = 'thinkingMsg';
  thinking.innerHTML = `
    <div class="msg-avatar ai">AI</div>
    <div><div class="msg-bubble thinking"><span></span><span></span><span></span></div></div>`;
  area.appendChild(thinking);
  area.scrollTop = area.scrollHeight;

  input.value = '';
  input.style.height = 'auto';
  setInputEnabled(false);

  try {
    const res = await apiFetch('/api/qna/ask', {
      method: 'POST',
      body: JSON.stringify({ documentId: selectedDocId, question: q })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.message || data.title || 'Request failed');

    const answer = data.answer || data.response || '(no answer returned)';
    const sourcesHtml = buildSourcesHtml(data.sources || data.sourceChunks || []);
    thinking.outerHTML = `
      <div class="msg">
        <div class="msg-avatar ai">AI</div>
        <div>
          <div class="msg-bubble">${escapeHtml(answer)}${sourcesHtml}</div>
          <div class="msg-time">${now}</div>
        </div>
      </div>`;
  } catch (e) {
    thinking.outerHTML = `
      <div class="msg">
        <div class="msg-avatar ai">AI</div>
        <div>
          <div class="msg-bubble" style="color:var(--danger);">Error: ${escapeHtml(e.message)}</div>
          <div class="msg-time">${now}</div>
        </div>
      </div>`;
  } finally {
    setInputEnabled(true);
    document.getElementById('chatArea').scrollTop = document.getElementById('chatArea').scrollHeight;
    document.getElementById('questionInput').focus();
  }
}

// ─────────────────────────────────────────────
//  Upload
// ─────────────────────────────────────────────
async function uploadFile(file) {
  if (!file) return;
  const zone = document.getElementById('uploadZone');
  zone.classList.add('uploading');
  zone.querySelector('p').innerHTML = `Uploading <span>${escapeHtml(file.name)}</span>…`;

  try {
    const form = new FormData();
    form.append('file', file);
    const res = await apiFetch('/api/documents/upload', { method: 'POST', body: form });
    const data = await res.json();
    if (!res.ok) throw new Error(data.message || data.title || 'Upload failed');
    showToast(`"${file.name}" uploaded successfully`, 'success');
    await loadDocuments();
    // Auto-select the new doc
    if (data.id || data.documentId) {
      await selectDoc(data.id || data.documentId);
    }
  } catch (e) {
    showToast('Upload failed: ' + e.message, 'error');
  } finally {
    zone.classList.remove('uploading');
    zone.querySelector('p').innerHTML = `<span>Click to upload</span> or drag & drop`;
    // Reset file input so same file can be re-uploaded
    document.getElementById('fileInput').value = '';
  }
}

// ─────────────────────────────────────────────
//  Delete
// ─────────────────────────────────────────────
async function confirmDelete() {
  if (!selectedDocId) return;
  const name = document.getElementById('docTitle').textContent;
  if (!confirm(`Delete "${name}" and all its Q&A history?`)) return;
  try {
    const res = await apiFetch(`/api/documents/${selectedDocId}`, { method: 'DELETE' });
    if (!res.ok && res.status !== 204) throw new Error('Delete failed');
    showToast(`"${name}" deleted`, 'success');
    clearInterval(pollTimer);
    selectedDocId = null;
    showMainEmpty();
    await loadDocuments();
  } catch (e) {
    showToast('Delete failed: ' + e.message, 'error');
  }
}

// ─────────────────────────────────────────────
//  Input helpers
// ─────────────────────────────────────────────
function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendQuestion(); }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

// ─────────────────────────────────────────────
//  Drag-and-drop on upload zone
// ─────────────────────────────────────────────
const zone = document.getElementById('uploadZone');
zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('dragover'); });
zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
zone.addEventListener('drop', e => {
  e.preventDefault();
  zone.classList.remove('dragover');
  const file = e.dataTransfer.files[0];
  if (file) uploadFile(file);
});

// ─────────────────────────────────────────────
//  Boot
// ─────────────────────────────────────────────
(function init() {
  if (token) {
    document.getElementById('userBadge').textContent = currentUsername || 'user';
    document.getElementById('loginOverlay').style.display = 'none';
    loadDocuments();
  }
})();
</script>
</body>
</html>
